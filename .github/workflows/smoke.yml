name: Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install yt-dlp and verify toolchain
        run: bash .cursor/install.sh

      - name: Start yt-dlp helper
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nohup python3 helper/yt_dlp_server.py > /tmp/helper.log 2>&1 &
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8787/health && break
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:8787/health || { echo "helper failed to start"; cat /tmp/helper.log; exit 1; }

      - name: Run smoke suite
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 scripts/smoke_unit.py
